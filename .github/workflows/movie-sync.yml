name: Automatic Movie Sync Engine

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Prevent concurrent jobs from modifying main simultaneously
concurrency:
  group: catalog-sync-group
  cancel-in-progress: false

jobs:
  sync-movies:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 starlette uvicorn

      - name: Execute Automatic Movie Sync
        env:
          AUTHORIZED_MOVIE_FEED_URL: ${{ secrets.AUTHORIZED_MOVIE_FEED_URL }}
        run: |
          python movie_web_app/sync_service.py

      - name: Resolve Intermediate URLs to Direct Download Endpoints
        run: |
          echo "Resolving intermediate download page URLs to direct endpoints..."
          python resolve_to_direct.py
          echo "Resolution complete."

      - name: Synchronize, Commit and Push Updated Catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TMP_DIR=$(mktemp -d)
          cp movies_data.js "$TMP_DIR/movies_data.js"
          cp movie_web_app/movies.db "$TMP_DIR/movies.db"

          MAX_RETRIES=5
          RETRY=0
          PUSH_SUCCESS=0

          while [ $RETRY -lt $MAX_RETRIES ]; do
            RETRY=$((RETRY + 1))
            echo "[INFO] Push attempt $RETRY of $MAX_RETRIES..."

            git fetch origin main
            git reset --hard origin/main

            cp "$TMP_DIR/movies_data.js" movies_data.js
            cp "$TMP_DIR/movies.db" movie_web_app/movies.db

            git add movies_data.js movie_web_app/movies.db

            if git diff --staged --quiet; then
              echo "[INFO] No changes found. Catalog is up to date."
              PUSH_SUCCESS=1
              break
            fi

            git commit -m "Auto-Sync: Updated catalog with direct download URLs [skip ci]"
            if git push origin HEAD:main; then
              PUSH_SUCCESS=1
              echo "[OK] Successfully pushed updated catalog to main."
              break
            else
              echo "[WARNING] Push rejected. Retrying in 2 seconds..."
              sleep 2
            fi
          done

          rm -rf "$TMP_DIR"

          if [ $PUSH_SUCCESS -ne 1 ]; then
            echo "[ERROR] Failed to push changes after $MAX_RETRIES attempts."
            exit 1
          fi
