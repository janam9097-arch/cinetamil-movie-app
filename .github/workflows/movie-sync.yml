name: Automatic Movie Sync Engine

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-movies:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 starlette uvicorn

      - name: Execute Automatic Movie Sync
        env:
          AUTHORIZED_MOVIE_FEED_URL: ${{ secrets.AUTHORIZED_MOVIE_FEED_URL }}
        run: |
          python movie_web_app/sync_service.py

      - name: Commit and Push Updated Catalog if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add movies_data.js movie_web_app/movies.db
          if git diff --staged --quiet; then
            echo "No new movies found. Catalog is up to date."
          else
            git commit -m "Auto-Sync: Added new movies from authorized feed [skip ci]"
            git push origin main
          fi
