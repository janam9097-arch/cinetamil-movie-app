name: Refresh Download URLs

on:
  schedule:
    # Run approximately every 55 minutes to keep temporary download tokens fresh
    - cron: '*/55 * * * *'
  workflow_dispatch:

# Prevent overlapping refresh jobs
concurrency:
  group: refresh-downloads-group
  cancel-in-progress: false

jobs:
  refresh-downloads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install httpx beautifulsoup4 starlette uvicorn
          fi

      - name: Run Download Refresh Script
        run: |
          echo "=========================================="
          echo "Start Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="
          
          python refresh_downloads.py
          
          echo "=========================================="
          echo "Completion Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================="

      - name: Commit and Push Updated Catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add movies_data.js movie_web_app/movies.db
          if git diff --staged --quiet; then
            echo "No changes in generated files. Repository is up to date."
          else
            git commit -m "Auto-Refresh: Updated temporary download URLs [skip ci]"
            git push origin main
          fi
