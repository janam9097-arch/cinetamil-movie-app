<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="referrer" content="no-referrer">
  <title>CineTamil - Direct Isaimini Movie Downloader</title>
  <meta name="description" content="Search Tamil movies, download HD MP4 Rips with permanent non-expiring download gateways.">
  <link rel="stylesheet" href="styles.css?v=16.0">
</head>
<body>

  <!-- Header Navbar -->
  <header>
    <div class="container nav-row">
      <a href="#" class="brand" onclick="loadCategory('tamil-2025')">
        <div class="brand-icon">🎬</div>
        <div>
          <div class="brand-title">CINE TAMIL</div>
          <div class="brand-subtitle">Permanent Movie Downloader</div>
        </div>
      </a>

      <div>
        <a href="https://github.com/janam9097-arch/cinetamil-movie-app" target="_blank" rel="noreferrer noopener" class="pill-btn active" style="text-decoration: none;">
          ⚡ GitHub Code
        </a>
      </div>
    </div>
  </header>

  <!-- Hero & Search -->
  <section class="container hero">
    <h1 class="hero-heading">Permanent Non-Expiring <span>Movie Downloader</span></h1>
    <p class="hero-sub">Tap any download option to get live, dynamically generated MP4 file links with zero token expiration.</p>

    <!-- Search Box -->
    <div class="search-form">
      <div class="search-input-wrapper">
        <span class="icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Type movie name (e.g. Jawan, Mask, Leo, Vikram, DC, Amaran, GOAT)...">
      </div>
    </div>

    <!-- Category Pills -->
    <div id="categoryPills" class="pills-bar" style="margin-top: 25px;">
      <!-- Injected via JS -->
    </div>

    <!-- A-Z Index -->
    <div id="atozBar" class="atoz-bar">
      <!-- Injected via JS -->
    </div>
  </section>

  <!-- Main Grid -->
  <main class="container">
    <div class="results-header">
      <div>
        <h2 id="sectionTitle" class="results-title">Trending Movies</h2>
        <p id="sectionSubtitle" style="color: var(--text-secondary); font-size: 0.85rem;">Showing active catalog</p>
      </div>
      <div id="resultCount" style="color: var(--accent-cyan); font-weight: 700;"></div>
    </div>

    <div id="moviesContainer" class="movies-grid">
      <!-- Cards rendered via JS -->
    </div>
  </main>

  <!-- Download Modal -->
  <div id="movieModal" class="modal-overlay" onclick="if(event.target.id==='movieModal') closeModal();">
    <div class="modal-box">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>CineTamil Direct Movie Downloader Engine (v16.0)</p>
      <p style="margin-top: 6px; display: flex; gap: 10px; justify-content: center; align-items: center;">
        <button onclick="clearCacheAndReload()" class="pill-btn" style="border-color: var(--accent-gold); color: var(--accent-gold); padding: 4px 12px; font-size: 0.78rem;">
          🔄 Refresh Latest Data & Clear Cache
        </button>
      </p>
    </div>
  </footer>

  <script src="movies_data.js?v=16.0"></script>
  <script src="app.js?v=16.0"></script>
</body>
</html>
